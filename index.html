<!DOCTYPE html>
<html>
    <head>
        <title>Typing Tester</title>
        
        <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,user-scalable=no">
        <script src="scripts/words.js"></script>
        <script src="scripts/main.js"></script>
        <link rel="stylesheet" href="styles/main.css" />
    </head>
    
    <body>
        
        <div class="container">
            <div id="words"></div><br />
            <input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" /> <label id="timer"></label>
            <select id="duration" title="Test length">
                <option value="15">15s</option>
                <option value="30">30s</option>
                <option value="60">60s</option>
                <option value="120">120s</option>
            </select>
            <button id="restartButton" title="Tab or Esc">Restart</button>
            <label id="autotype"><input type="checkbox" />Auto-Type</label>
            
            <br /><br />
            <div id="result">Your Typing Speed is: <b>0 WPM</b></div>
            <br /><br />
            
            <div class="uploadstuff">
                Upload a Word List: <input type="file" id="wupload" />
            </div>
        </div>
        
    </body>
</html>
